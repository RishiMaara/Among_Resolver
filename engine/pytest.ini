[pytest]
# Discovery is pinned to tests/ on purpose.
#
# scripts/ holds manual tools, and one of them was named test_upload.py — which
# matches pytest's default test_*.py pattern. It POSTs to localhost:8001 at
# module level, so merely COLLECTING it fired a live request, and with no
# server up the connection error aborted the whole run: "1 error during
# collection", zero tests, before a single real test was reached.
#
# That is the state anyone cloning this repo and running `pytest` would hit.
# The script is now manual_upload_check.py so its name no longer claims to be
# a test, and this setting means a future script cannot reintroduce the same
# failure by being named badly.
testpaths = tests
